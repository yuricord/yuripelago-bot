[package]
name = "archi-bot"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "entity", "migration", "archi_client"]

[dependencies]
poise = "0.6.1"
sea-orm = { version = "1.1.10", features = ["sqlx-sqlite", "runtime-tokio-rustls", "with-json"] }
tokio = "1.44.2"

entity = { path = "entity" }
migration = {path="migration"}
archi_client = {path="archi_client"}
dotenvy = "0.15.7"
anyhow = "1.0.98"
