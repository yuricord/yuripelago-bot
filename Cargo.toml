[package]
name = "archi-bot"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "entity", "migration", "archi_client"]

[workspace.dependencies]
anyhow = "1.0"
sea-orm = { version = "1.1", features = ["sqlx-sqlite", "runtime-tokio-rustls", "with-json", "debug-print"] }
serde = { version = "1.0", features = ["derive"]}
thiserror = "2.0"
tokio = "1.44"

archi_client = {path = "archi_client" }
entity = { path = "entity" }
migration = {path = "migration" }


[dependencies]
# workspace crates.io dependencies
anyhow.workspace = true
sea-orm.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true

# workspace local dependencies
entity.workspace = true
migration.workspace = true
archi_client.workspace = true

# non-workspace dependencies
config = { version = "0.15.11", default-features = false, features = ["toml", "convert-case", "async"] }
poise = "0.6"
tracing = "0.1"
tracing-subscriber = "0.3"
poise_error = { git = "https://github.com/pyrox0/poise-error", rev="9b79fd7aff48a621884bdcca87fd9d9efcc20918" }
dashmap = "6.1"
itertools = "0.14"
catppuccin = "2.5.1"
